[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = [
  "corpus_builds",
  "downloaded_*",
  "processed_corpora",
  "protected_corpora",
  "scripts/.formosan_qc_repo",
  "scripts/.formosan_qc_scripts",
  "scripts/local/scripts/.formosan_qc_scripts",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
